name: 'Notify failure slack'
inputs:
  slack-bot-token:
    description: 'Slack bot token'
    required: true
  slack-channel-id:
    description: 'Slack channel id'
    required: true
runs:
  using: "composite"
  steps:
    - name: Set job URL
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        JOB_URL=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
          --jq '.jobs[] | select(.name == "${{ github.job }}") | .html_url' 2>/dev/null || echo "")
        echo $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs")
        if [ -z "$JOB_URL" ]; then
          JOB_URL="$RUN_URL"
        fi
        echo "JOB_URL=$JOB_URL" >> $GITHUB_ENV
    - name: Notify Slack on Failure (PR)
      uses: slackapi/slack-github-action@v2.1.1
      if: github.event_name == 'pull_request'
      with:
        errors: true
        method: chat.postMessage
        token: ${{ inputs.slack-bot-token }}
        payload: |
          channel: ${{ inputs.slack-channel-id }}
          text: "Job Failed: ${{ github.job }}"
          attachments:
            - color: "#A30200"
              blocks:
                - type: section
                  text:
                    type: mrkdwn
                    text: >-
                      ❌ *Job Failed:* <${{ env.JOB_URL }}|${{ github.job }}>
                      
                      *Pull Request:* <${{ github.event.pull_request.html_url }}|${{ github.event.pull_request.title }}>
                - type: actions
                  elements:
                    - type: button
                      text:
                        type: plain_text
                        text: "View Failed Job"
                      url: "${{ env.JOB_URL }}"
    - name: Notify Slack on Failure (Push)
      uses: slackapi/slack-github-action@v2.1.1
      if: github.event_name == 'push'
      with:
        errors: true
        method: chat.postMessage
        token: ${{ inputs.slack-bot-token }}
        payload: |
          channel: ${{ inputs.slack-channel-id }}
          text: "Job Failed: ${{ github.job }}"
          attachments:
            - color: "#A30200"
              blocks:
                - type: section
                  text:
                    type: mrkdwn
                    text: >-
                      ❌ *Job Failed:* <${{ env.JOB_URL }}|${{ github.job }}>
                      
                      *Branch:* `${{ github.ref_name }}`
                - type: actions
                  elements:
                    - type: button
                      text:
                        type: plain_text
                        text: "View Failed Job"
                      url: "${{ env.JOB_URL }}"
