name: 'Notify failure slack'
inputs:
  slack-bot-token:
    description: 'Slack bot token'
    required: true
  slack-channel-id:
    description: 'Slack channel id'
    required: true
runs:
  using: "composite"
  steps:
    - uses: qoomon/actions--context@v5
      id: context

    - name: Set Job URL
      shell: bash
      run: |
        echo "JOB_URL=${{ steps.context.outputs.job_html_url || steps.context.outputs.run_html_url }}" >> $GITHUB_ENV
    - name: Notify Slack on Failure (PR)
      uses: slackapi/slack-github-action@v2.1.1
      if: github.event_name == 'pull_request'
      with:
        errors: true
        method: chat.postMessage
        token: ${{ inputs.slack-bot-token }}
        payload: |
          channel: ${{ inputs.slack-channel-id }}
          text: "Job Failed: ${{ github.job }}"
          attachments:
            - color: "#A30200"
              blocks:
                - type: section
                  text:
                    type: mrkdwn
                    text: >-
                      ❌ *Job Failed:* <${{ env.JOB_URL }}|${{ github.job }}>
                      
                      *Pull Request:* <${{ github.event.pull_request.html_url }}|${{ github.event.pull_request.title }}>
                - type: actions
                  elements:
                    - type: button
                      text:
                        type: plain_text
                        text: "View Failed Job"
                      url: "${{ env.JOB_URL }}"
    - name: Notify Slack on Failure (Push)
      uses: slackapi/slack-github-action@v2.1.1
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      with:
        errors: true
        method: chat.postMessage
        token: ${{ inputs.slack-bot-token }}
        payload: |
          channel: ${{ inputs.slack-channel-id }}
          text: "Job Failed: ${{ github.job }}"
          attachments:
            - color: "#A30200"
              blocks:
                - type: section
                  text:
                    type: mrkdwn
                    text: >-
                      ❌ *Job Failed:* <${{ env.JOB_URL }}|${{ github.job }}>
                      
                      *Branch:* `${{ github.ref_name }}`
                - type: actions
                  elements:
                    - type: button
                      text:
                        type: plain_text
                        text: "View Failed Job"
                      url: "${{ env.JOB_URL }}"
