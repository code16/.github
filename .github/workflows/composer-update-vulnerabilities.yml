# This workflow runs a composer audit on a list of repositories and creates a PR if composer.lock is updated.
#
# Required Secrets:
# - GITHUB_REPOSITORIES_TOKEN_CU: A Personal Access Token with 'repo' scope to checkout and create PRs in other repositories.

name: Composer Audit & PR
on:
  workflow_dispatch:
    inputs:
      repositories:
        description: 'Comma-separated list of repositories'
        required: false
        default: 'acacia, acero, athena, cimex, ekip, ekip, hordeo, kolben, maktaba, mensa, merkur, ozu, pistosi, platina, seriaki, shelby, sola, solek, syzito, tajmil'
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          # Convert comma-separated string to JSON array, prepending 'code16/' if missing
          REPOS=$(echo "${{ github.event.inputs.repositories }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed 's|^[^/]*$|code16/&|' | jq -R . | jq -s -c .)
          echo "matrix=$REPOS" >> $GITHUB_OUTPUT

  composer-audit:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.GITHUB_REPOSITORIES_TOKEN_CU || github.token }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
          github-token: ${{ secrets.COMPOSER_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Add github token to composer config
        run: |
          if [ -n "${{ secrets.FLUX_USERNAME }}" ] && [ -n "${{ secrets.FLUX_LICENSE_KEY }}" ]; then
            composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"
          fi
          if [ -n "${{ secrets.COMPOSER_AUTH_TOKEN }}" ]; then
            composer config github-oauth.github.com ${{ secrets.COMPOSER_AUTH_TOKEN }}
          fi

      - name: Composer Audit and Update
        id: audit
        run: |
          # Get the list of packages with security advisories
          VULNERABLE_PACKAGES=$(composer audit --format=json 2>/dev/null | jq -r '.advisories | keys | .[]' | tr '\n' ' ')
          
          if [ -n "$VULNERABLE_PACKAGES" ]; then
            echo "Vulnerable packages found: $VULNERABLE_PACKAGES"
            echo "Updating vulnerable packages..."
            composer update $VULNERABLE_PACKAGES --no-install --no-scripts
            echo "vulnerable_packages=$VULNERABLE_PACKAGES" >> $GITHUB_OUTPUT
          else
            echo "No vulnerable packages found."
          fi

      - name: Final Composer Audit
        run: composer audit

