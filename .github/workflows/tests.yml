name: Unit tests back
on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version'
        type: string
      is-package:
        description: 'Whether the project is a package'
        type: boolean
        default: false
      has-browser-tests:
        description: 'Does the project have Pest Browser tests (e2e)? if so it will install node + playwright'
        type: boolean
        default: false
      has-browsershot:
        description: 'Does the project use Spatie Browsershot? if so it will install node + puppeteer + chrome'
        type: boolean
        default: false
      test-command:
        description: 'Test command to run'
        type: string
        required: false
      setup-command:
        description: 'Command run once the dependencies are installed, before the tests (e.g. to install project specific tools)'
        type: string
        required: false
      slack-channel-id:
        description: 'Slack channel id'
        type: string
        required: true
      shard:
        description: 'Shard parameter passed to Pest (e.g. "1/4")'
        type: string
        default: ''
      update-shards:
        description: 'Whether to update shards'
        type: boolean
        default: false
      parallel:
        description: 'Whether to run Pest tests in parallel (--parallel), one process per CPU'
        type: boolean
        default: false
    secrets:
      FLUX_USERNAME:
        description: 'Flux username'
        required: false
      FLUX_LICENSE_KEY:
        description: 'Flux license key'
        required: false
      COMPOSER_AUTH_TOKEN:
        description: 'Composer auth token'
        required: false
      SLACK_BOT_TOKEN:
        description: 'Slack bot token'
        required: true
jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    env:
      APP_KEY: 'base64:sorUHw3uTOYdZXsJhRA13+2dYiSeG90TMkAHyFDKrVk='
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_CONNECTION: mysql
      DB_DATABASE: our-awesome-tested-app
      DB_USERNAME: root
      DB_PASSWORD: password
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: false
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: our-awesome-tested-app
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.head_ref || github.ref }}
      - name: Check ray() calls
        uses: code16/detect-laravel-ray-action@v1
      # Always runs (in background, so it's free): `wait` doesn't support `if`, and waiting on
      # a skipped step is undocumented. npm cache only when needed (it requires a lock file).
      - name: Setup Node
        id: setup-node
        background: true
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
          cache: ${{ (inputs.has-browser-tests || inputs.has-browsershot) && 'npm' || '' }}
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php-version }}
          github-token: ${{ secrets.COMPOSER_AUTH_TOKEN }}
          extensions: mbstring, dom, fileinfo, mysql
      - name: Add github token to composer config
        run: |
          if [ -n "${{ secrets.FLUX_USERNAME }}" ] && [ -n "${{ secrets.FLUX_LICENSE_KEY }}" ]; then
            composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"
          fi
          if [ -n "${{ secrets.COMPOSER_AUTH_TOKEN }}" ]; then
            composer config github-oauth.github.com ${{ secrets.COMPOSER_AUTH_TOKEN }} # github code16 organization secret
          fi
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock', '**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install Composer dependencies
        id: composer-install
        background: true
        run: composer install --prefer-dist
      # Node PATH/env from setup-node is only available after waiting for it
      - wait: setup-node
      # npm ci and the puppeteer install both write node_modules: they stay sequential
      - if: ${{ inputs.has-browser-tests }}
        name: Install NPM dependencies
        run: npm ci
      - if: ${{ inputs.has-browsershot }}
        name: Install Puppeteer (Browsershot)
        run: npm install --no-save puppeteer
      # Browser downloads only need node_modules and write to their own cache dirs
      - if: ${{ inputs.has-browser-tests }}
        name: Install Playwright Browsers
        background: true
        # No --with-deps: system libs are already on ubuntu-latest (Chrome is preinstalled)
        run: npx playwright install chromium
      - if: ${{ inputs.has-browsershot }}
        name: Install Chrome (Browsershot)
        background: true
        run: npx puppeteer browsers install chrome
      - if: ${{ inputs.has-browsershot }}
        name: Install Chrome headless shell (Browsershot)
        background: true
        run: npx puppeteer browsers install chrome-headless-shell
      - wait: composer-install
      - name: Run Security Audit
        run: composer audit
      # Assets may import from vendor/ (Flux, Sharp...): needs Composer, not the browsers
      - if: ${{ inputs.has-browser-tests }}
        name: Build assets
        run: npm run build
      - wait-all:
      - if: ${{ inputs.setup-command }}
        name: Project setup
        run: ${{ inputs.setup-command }}
      - name: Create .env
        if: ${{ !inputs.is-package }}
        run: touch .env
#      - name: Run Migration
#        if: ${{ !inputs.is-package }}
#        run: php artisan migrate -v
#        env:
#          DB_PORT: ${{ job.services.mysql.ports['3306'] }}
      - name: Execute tests
        run: |
          if [ -n "${{ inputs.test-command }}" ]; then
            eval "${{ inputs.test-command }}"
          elif [ -f ./vendor/bin/pest ]; then
            ./vendor/bin/pest --ci \
              ${{ inputs.update-shards == true && '--update-shards' || '' }} \
              ${{ inputs.shard != '' && format('--shard={0}', inputs.shard) || '' }} \
              ${{ inputs.parallel == true && '--parallel' || '' }}
          else
            ./vendor/bin/phpunit --colors=never
          fi
        env:
          DB_PORT: ${{ job.services.mysql.ports['3306'] }}
      - name: Commit shards.json
        if: ${{ inputs.update-shards }}
        run: |
          git add tests/.pest/shards.json

          if [ -n "$(git status --porcelain)" ]; then
            git \
              -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update shards.json" \
              --author="${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>"
            git push
          else
            echo "Nothing to commit"
          fi
      - if: ${{ inputs.has-browser-tests && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: browser-tests-screenshots-logs
          path: |
            tests/Browser/Screenshots
            tests/Browser/Tracing
            tests/Browser/Traces
            storage/logs
      - name: Notify Slack on failure
        uses: code16/.github/.github/actions/slack-notify-failure@main
        if: failure() && (github.base_ref == 'production' || inputs.is-package)
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ inputs.slack-channel-id }}

