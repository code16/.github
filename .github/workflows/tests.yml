name: Unit tests back
on:
  workflow_call:
    inputs:
      slack-webhook-url:
        description: 'Slack webhook URL'
        required: true
        type: string
      php-version:
        description: 'PHP version (taken from composer.json otherwise)'
        type: string
      test-command:
        description: 'Test command to run (default: "php artisan test")'
        type: string
        default: 'php artisan test'
    secrets:
      FLUX_USERNAME:
        description: 'Flux username'
        required: true
      FLUX_LICENSE_KEY:
        description: 'Flux license key'
        required: true
      COMPOSER_AUTH_TOKEN:
        description: 'Composer auth token'
        required: true
jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_CONNECTION: mysql
      DB_DATABASE: our-awesome-tested-app
      DB_USERNAME: root
      DB_PASSWORD: password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: false
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: our-awesome-tested-app
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - name: Check ray() calls
        uses: code16/detect-laravel-ray-action@v1
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, dom, fileinfo, mysql
      - name: Add github token to composer config
        run: |
          composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"
          composer config github-oauth.github.com ${{ secrets.COMPOSER_AUTH_TOKEN }} # github code16 organization secret
      - name: Get composer cache directory
        id: composer-cache
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"
      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install Composer dependencies
        run: composer install --no-progress --no-suggest --prefer-dist --optimize-autoloader
      - name: Generate key + .env
        run: |
          cp .env.ci .env
          php artisan key:generate
          echo -e "DB_PORT=${{ job.services.mysql.ports['3306'] }}" >> .env
      - name: Clear Config
        run: php artisan config:clear
      - name: Run Migration
        run: php artisan migrate -v
      - name: Execute tests
        run: ${{ inputs.test-command }}
      - uses: 8398a7/action-slack@v3
        if: failure() && github.base_ref == 'production'
        with:
          status: ${{ job.status }}
          fields: job, message, author
        env:
          MATRIX_CONTEXT: ${{ toJson(matrix) }}
          SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook-url }}

