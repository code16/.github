name: Unit tests back
on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version'
        type: string
      is-package:
        description: 'Whether the project is a package'
        type: boolean
        default: false
      has-browser-tests:
        description: 'Does the project have Pest Browser tests (e2e)? if so it will install node + playwright'
        type: boolean
        default: false
      test-command:
        description: 'Test command to run (default: "php artisan test")'
        type: string
        default: 'php artisan test'
      slack-channel-id:
        description: 'Slack channel id'
        type: string
        required: true
    secrets:
      FLUX_USERNAME:
        description: 'Flux username'
        required: true
      FLUX_LICENSE_KEY:
        description: 'Flux license key'
        required: true
      COMPOSER_AUTH_TOKEN:
        description: 'Composer auth token'
        required: true
      SLACK_BOT_TOKEN:
        description: 'Slack bot token'
        required: true
jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    env:
      APP_KEY: 'base64:sorUHw3uTOYdZXsJhRA13+2dYiSeG90TMkAHyFDKrVk='
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_CONNECTION: mysql
      DB_DATABASE: our-awesome-tested-app
      DB_USERNAME: root
      DB_PASSWORD: password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: false
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: our-awesome-tested-app
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Define SLACK_WEBHOOK_URL
        id: slack-url
        run: |
          if [ -n "${{ inputs.slack-webhook-url }}" ]; then
            echo "SLACK_WEBHOOK_URL=${{ inputs.slack-webhook-url }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}" >> $GITHUB_ENV
          fi
      - uses: actions/checkout@v4
      - name: Check ray() calls
        uses: code16/detect-laravel-ray-action@v1
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          github-token: ${{ secrets.COMPOSER_AUTH_TOKEN }}
          extensions: mbstring, dom, fileinfo, mysql
      - if: ${{ inputs.has-browser-tests }}
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Add github token to composer config
        run: |
          composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"
          composer config github-oauth.github.com ${{ secrets.COMPOSER_AUTH_TOKEN }} # github code16 organization secret
      - name: Get composer cache directory
        id: composer-cache
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"
      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install Composer dependencies
        run: composer install --no-progress --no-suggest --prefer-dist --optimize-autoloader
      - name: Run Security Audit
        run: composer audit
      - if: ${{ inputs.has-browser-tests }}
        name: Install NPM dependencies
        run: npm ci
      - if: ${{ inputs.has-browser-tests }}
        name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
      - if: ${{ inputs.has-browser-tests }}
        name: Build assets
        run: npm run build
      - name: Create .env
        if: ${{ !inputs.is-package }}
        run: touch .env
#      - name: Run Migration
#        if: ${{ !inputs.is-package }}
#        run: php artisan migrate -v
#        env:
#          DB_PORT: ${{ job.services.mysql.ports['3306'] }}
      - name: Execute tests
        run: ${{ inputs.test-command }}
        env:
          DB_PORT: ${{ job.services.mysql.ports['3306'] }}
      - name: Notify Slack on failure
        uses: code16/.github/.github/actions/slack-notify-failure@main
        if: failure() && (github.base_ref == 'production' || inputs.is-package)
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ inputs.slack-channel-id }}

