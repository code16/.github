name: Unit tests back
on:
  workflow_call:
    inputs:
      slack-webhook-url:
        description: 'Slack webhook URL'
        required: true
        type: string
      php-version:
        description: 'PHP version (taken from composer.json otherwise)'
        type: string
      is-package:
        description: 'Whether the project is a package'
        type: boolean
        default: false
      test-command:
        description: 'Test command to run (default: "php artisan test")'
        type: string
        default: 'php artisan test'
    secrets:
      FLUX_USERNAME:
        description: 'Flux username'
        required: true
      FLUX_LICENSE_KEY:
        description: 'Flux license key'
        required: true
      COMPOSER_AUTH_TOKEN:
        description: 'Composer auth token'
        required: true
jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    env:
      APP_KEY: 'base64:sorUHw3uTOYdZXsJhRA13+2dYiSeG90TMkAHyFDKrVk='
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_CONNECTION: mysql
      DB_DATABASE: our-awesome-tested-app
      DB_USERNAME: root
      DB_PASSWORD: password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: false
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: our-awesome-tested-app
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - name: Check ray() calls
        uses: code16/detect-laravel-ray-action@v1
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, dom, fileinfo, mysql
      - name: Add github token to composer config
        run: |
          composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"
          composer config github-oauth.github.com ${{ secrets.COMPOSER_AUTH_TOKEN }} # github code16 organization secret
      - name: Get composer cache directory
        id: composer-cache
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"
      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install Composer dependencies
        run: composer install --no-progress --no-suggest --prefer-dist --optimize-autoloader
      - name: Run Security Audit
        run: composer audit
      - name: Create .env
        if: ${{ !inputs.is-package }}
        run: touch .env
#      - name: Run Migration
#        if: ${{ !inputs.is-package }}
#        run: php artisan migrate -v
#        env:
#          DB_PORT: ${{ job.services.mysql.ports['3306'] }}
      - name: Define SLACK_WEBHOOK_URL
        id: slack-url
        run: |
            if [ -n "${{ inputs.slack-webhook-url }}" ]; then
              echo "SLACK_WEBHOOK_URL=${{ inputs.slack-webhook-url }}" >> $GITHUB_ENV
            elif [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
              echo "SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}" >> $GITHUB_ENV
            fi
      - name: Execute tests
        run: ${{ inputs.test-command }}
        env:
          DB_PORT: ${{ job.services.mysql.ports['3306'] }}
      - uses: 8398a7/action-slack@v3
        if: failure() && (github.base_ref == 'production' || inputs.is-package)
        with:
          status: ${{ job.status }}
          fields: job, message, author, repo
        env:
          MATRIX_CONTEXT: ${{ toJson(matrix) }}
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}

